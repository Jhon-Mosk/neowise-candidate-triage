<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status:empty { display: none; }
    #status { padding: .5rem .75rem; border-left: 4px solid #c77700; background: #fff6e5; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа — проверьте перед отправкой</label>
    <textarea id="draft" rows="4"></textarea>
  </section>
  <script type="module">
    import { toView, PENDING_VIEW } from "/view.mjs";

    const CLIENT_TIMEOUT_MS = 5_000;
    const form = document.querySelector("form");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    let current = null;

    // Каждое поле перезаписывается при каждом ответе, поэтому старый черновик
    // не может остаться на экране. textContent/value — без HTML от модели.
    function render(view) {
      status.textContent = view.message;
      topic.textContent = view.topic;
      draft.value = view.draft;
      result.hidden = view.draft === "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      current?.abort();
      const controller = new AbortController();
      current = controller;
      render(PENDING_VIEW);

      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
          signal: AbortSignal.any([controller.signal, AbortSignal.timeout(CLIENT_TIMEOUT_MS)]),
        });
        const body = await reply.json().catch(() => null);
        view = toView(reply.status, body);
      } catch {
        if (controller.signal.aborted) return; // запрос заменён новым
        view = toView(0, null); // сеть или таймаут — ручной разбор
      }
      if (controller !== current) return; // пришёл ответ на устаревший запрос
      render(view);
    });
  </script>
</body>
</html>
